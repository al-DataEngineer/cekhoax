name: Sync Berita Hoax (tiap 10 menit)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Panggil endpoint cron sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://${DEPLOY_URL}/api/cron/sync" || echo "Cron gagal — cek log Vercel"
